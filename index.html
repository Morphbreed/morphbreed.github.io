<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morphbreed – Apps</title>
  <meta name="description" content="Kleine Web-Apps von Morphbreed">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --text: #222;
      --muted: #6b6b6b;
      --border: #e6e1d8;
      --accent: #b5651d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1a18;
        --card: #262421;
        --text: #eee;
        --muted: #a29d94;
        --border: #3a3732;
        --accent: #e09a5a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 16px;
    }

    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 32px; }

    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }

    a.app {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.15s;
    }
    a.app:hover, a.app:focus-visible { border-color: var(--accent); transform: translateY(-2px); }

    .icon {
      flex: none;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 1.6rem;
      border-radius: 12px;
      background: var(--bg);
    }

    .name { font-weight: 600; font-size: 1.1rem; }
    .desc { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Morphbreed</h1>
    <p class="subtitle">Kleine Web-Apps</p>

    <!-- Neue App: einfach ein weiteres <li> hinzufügen. -->
    <ul>
      <li>
        <a class="app" href="/mala-app/">
          <span class="icon">📿</span>
          <span>
            <span class="name">Mala Designer</span>
            <span class="desc">Mala-Ketten in 3D gestalten</span>
          </span>
        </a>
      </li>
      <li>
        <a class="app" href="/tao-app/">
          <span class="icon">☯️</span>
          <span>
            <span class="name">Tao</span>
            <span class="desc">Daodejing, taoistische Meditation und Geschichten aus Dschuang Dsi</span>
          </span>
        </a>
      </li>
      <li>
        <a class="app" href="/ukulele-app/">
          <span class="icon">🎵</span>
          <span>
            <span class="name">Ukulele Noten-Drill</span>
            <span class="desc">Noten lesen üben – die App hört zu, ob du richtig spielst</span>
          </span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
